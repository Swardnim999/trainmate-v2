name: trainmate-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trainmate
      POSTGRES_PASSWORD: trainmate_dev
      POSTGRES_DB: trainmate
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trainmate -d trainmate']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # Pinned to a specific release (matches what `latest` points at) instead of
    # a moving `:latest` tag — a future image change must be an explicit choice.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://trainmate:trainmate_dev@postgres:5432/trainmate
    ports:
      - '3000:3000'
    # No depends_on: the api connects to none of these services in Sprint 1
    # (no DB / redis / S3 access yet), so it must not be held up by a broken
    # dependency it doesn't use. Re-add `condition: service_healthy` entries
    # here when Phase 2 wires real connections.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Disposable Postgres for the integration test harness (Phase 2+).
  # Start on demand: docker compose --profile test up -d testdb
  testdb:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: trainmate
      POSTGRES_PASSWORD: trainmate_test
      POSTGRES_DB: trainmate_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trainmate -d trainmate_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
